<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhiskerWood — World Editor 🌿🗺️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3a1c; font-family: system-ui, sans-serif; }
  #edit { display: block; width: 100%; height: 100%; }
  #toolbar {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 12px; border-radius: 12px; background: rgba(20,28,12,0.82);
    color: #eef3df; backdrop-filter: blur(6px);
  }
  #toolbar b { color: #cfe89a; margin-right: 6px; }
  #toolbar button {
    padding: 9px 14px; border: none; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: bold; background: #6d9a3f; color: #fff;
  }
  #toolbar button.save { background: #d49a3a; }
  #toolbar button.del { background: #b04a44; }
  #toolbar button.sel { background: #3a6a8a; }
  #toolbar button:disabled { opacity: 0.4; cursor: default; }
  #status { margin-left: auto; font-size: 13px; opacity: 0.9; }
  #hint {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    padding: 8px 12px; border-radius: 10px; background: rgba(20,28,12,0.7);
    color: #eef3df; font-size: 13px; max-width: 360px; line-height: 1.5;
  }
  #sel-name {
    position: fixed; bottom: 12px; right: 12px; z-index: 10;
    padding: 8px 12px; border-radius: 10px; background: rgba(20,28,12,0.7);
    color: #ffe6a8; font-size: 14px; font-weight: bold;
  }
</style>
</head>
<body>
  <canvas id="edit"></canvas>

  <div id="toolbar">
    <b>🗺️ World Editor</b>
    <button id="upload">📤 Upload model</button>
    <button id="bigger" class="sel" disabled>➕ Bigger</button>
    <button id="smaller" class="sel" disabled>➖ Smaller</button>
    <button id="rotate" class="sel" disabled>↻ Rotate</button>
    <button id="delete" class="del" disabled>🗑 Delete</button>
    <button id="save" class="save">💾 Save to game</button>
    <span id="status"></span>
    <input id="file" type="file" accept=".glb,.gltf,.fbx,.obj,.unitypackage" style="display:none" />
  </div>

  <div id="hint">
    <b>Drag</b> a thing to move it • <b>drag the grass</b> to pan • <b>scroll</b> to zoom<br>
    Click something to select it, then use the buttons (or press Delete).<br>
    📤 Upload <b>.glb .gltf .fbx .obj</b> models — or a whole <b>.unitypackage</b> (I'll pull the models out of it!).
  </div>
  <div id="sel-name"></div>

  <script type="module" src="/src/world-editor.js"></script>
</body>
</html>
